version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    groups: { rust: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
